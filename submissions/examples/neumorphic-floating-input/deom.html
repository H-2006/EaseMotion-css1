<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neumorphic Floating Input Field - EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="neu-input-container">
    <div class="neu-input-wrapper">
      <input 
        type="text" 
        id="neu-field" 
        class="neu-input-field" 
        placeholder=" " 
        required 
      />
      <label for="neu-field" class="neu-input-label">
        Enter Username
      </label>
    </div>
  </div>

</body>
</html>
